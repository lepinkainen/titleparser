version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gocritic
    - revive
    - errorlint
    - bodyclose
    - sqlclosecheck
    - gosec
    - unparam
    - gocyclo
    # noctx + contextcheck disabled until context is threaded through
    # handlers + cache — tracked in https://github.com/lepinkainen/titleparser/issues/760
    # - noctx
    # - contextcheck
  exclusions:
    paths:
      - llm-shared
    rules:
      - path: _test\.go
        linters:
          - gosec
      - path: llm-shared/
        linters:
          - gocritic
          - revive
  settings:
    govet:
      enable:
        - shadow
    gocyclo:
      min-complexity: 18
    gosec:
      excludes:
        # SSRF on caller-supplied URLs is the whole point of a titleparser —
        # it fetches arbitrary user URLs by design.
        - G107 # http request with variable URL
        - G704 # taint-tracked SSRF
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*net/http.Response).Body.Close
        - os.Setenv
        - os.Unsetenv
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - exitAfterDefer
        - rangeValCopy
        - hugeParam
        - ifElseChain
        - paramTypeCombine
        - unnamedResult
        - singleCaseSwitch
        - importShadow
        - commentFormatting
        - regexpSimplify
        - httpNoBody
        - assignOp
        - commentedOutCode
    revive:
      severity: warning
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
