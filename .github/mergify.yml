pull_request_rules:
  - name: automatic Dependabot merge when CI passes
    conditions:
      - author=dependabot[bot]
      - check-success=Test
      - check-success=Lint
      - check-success=Build
      - base=master
    actions:
      merge:
        method: merge
  - name: label Dependabot
    conditions:
      - author=dependabot[bot]
    actions:
      label:
        add:
          - dependabot
  - name: remove outdated reviews
    conditions:
      - base=master
    actions:
      dismiss_reviews: {}
